<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrusel - Ciudades de Marruecos</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300 min-h-screen font-sans">

  <main class="max-w-6xl mx-auto px-6 py-12 -translate-y-3">

    <section class="relative bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl rounded-[2rem] overflow-hidden">

      <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
          🌍 Ciudades de Marruecos
        </h1>

        <button id="autoPlayBtn"
          class="px-6 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-semibold shadow-lg hover:scale-105 active:scale-95 transition">
          ▶ Auto Play
        </button>
      </div>

      <div class="relative group">

        <img id="carouselImage"
          class="w-full h-[420px] object-cover transition-all duration-700"
          src=""
          alt="">

        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

        <button id="prevBtn"
          class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white text-3xl w-12 h-12 rounded-full flex items-center justify-center transition">
          ❮
        </button>

        <button id="nextBtn"
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white text-3xl w-12 h-12 rounded-full flex items-center justify-center transition">
          ❯
        </button>
      </div>

      <div class="p-6 bg-white">
        <h2 id="carouselTitle" class="text-2xl md:text-3xl font-bold text-slate-900"></h2>

        <p id="carouselDescription" class="mt-2 text-slate-600 leading-relaxed"></p>

        <ul id="carouselFeatures" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-2 text-slate-700 list-disc ml-5"></ul>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
