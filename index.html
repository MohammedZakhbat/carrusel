<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./output.css">
    <title>Carrusel</title>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <main class="max-w-7xl mx-auto px-5 py-10">
    <section class="mt-10 bg-black rounded-3xl p-6 shadow-2xl">

            <div class="grid grid-cols-[1fr_2fr_1fr] items-center mb-8">

                <div></div>
               <h1 class="text-5xl md:text-6xl font-extrabold text-white tracking-wide text-center">
    🌍 Ciudades de Marruecos
</h1>

                <div class="flex justify-end">
        <button 
            id="autoPlayBtn"
            class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:scale-105 transition duration-300 text-white font-bold px-5 py-2 rounded-full shadow-lg"
        >
            ▶ Auto
        </button>
    </div>

            </div>

            <div class="relative">

                <img id="carouselImage" src="" alt=""
                    class="w-full h-[400px] object-cover rounded-2xl transition-all duration-700">

                <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-5xl font-bold">

                    ❮

                </button>

                <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-5xl font-bold">

                    ❯

                </button>

            </div>

            <div class="text-white mt-5">

                <h2 id="carouselTitle" class="text-3xl font-bold mb-2">
                </h2>

                <p id="carouselDescription" class="text-lg mb-3">
                </p>

                <ul id="carouselFeatures" class="space-y-1 text-base list-disc ml-5">
                </ul>

            </div>

        </section>
        </main>
    <script src="app.js"></script>
</body>
</html>
