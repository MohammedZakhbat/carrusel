<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel - Ciudades de Marruecos</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-black min-h-[100dvh] overflow-hidden font-sans">

  <main class="relative w-full h-[100dvh]">

    <section class="relative w-full h-full">

      <img id="carouselImage"
        class="absolute inset-0 w-full h-full object-cover transition-all duration-700"
        src=""
        alt="">

      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-black/10"></div>

      <div class="absolute top-6 left-6 right-6 flex items-center justify-between z-10">
        <h1 class="text-white text-xl md:text-3xl font-bold">
          🌍 Ciudades de Marruecos
        </h1>

        <button id="autoPlayBtn"
          class="px-4 py-2 rounded-full bg-white/20 text-white backdrop-blur-md hover:bg-white/30 transition">
          ▶ Auto Play
        </button>
      </div>

      <button id="prevBtn"
        class="absolute left-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 rounded-full bg-white/20 text-white text-2xl backdrop-blur-md hover:bg-white/40 transition">
        ❮
      </button>

      <button id="nextBtn"
        class="absolute right-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 rounded-full bg-white/20 text-white text-2xl backdrop-blur-md hover:bg-white/40 transition">
        ❯
      </button>

      <div class="absolute bottom-0 left-0 right-0 p-6 text-white z-10">
        <h2 id="carouselTitle" class="text-2xl md:text-4xl font-bold"></h2>
        <p id="carouselDescription" class="mt-2 text-sm md:text-base text-white/80"></p>

        <ul id="carouselFeatures" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-2 text-white/90 text-sm"></ul>
      </div>

    </section>

  </main>
<script src="app.js"></script>

</body>

</html>
